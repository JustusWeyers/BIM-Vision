version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - config.env
    environment:
      - DATABASE_URL=postgresql://bimuser:${DB_PASSWORD}@db:5432/bimdb
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=bimuser
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=bimdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
